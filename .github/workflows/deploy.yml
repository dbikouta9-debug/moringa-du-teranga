# Workflow de déploiement automatique sur GitHub Pages
name: Deploy to GitHub Pages

on:
  # Se déclenche à chaque push sur la branche principale
  push:
    branches: ["main"]

  # Permet aussi un déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

# Permissions du GITHUB_TOKEN pour le déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Étape 1 : build de l'application
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Dossier de sortie du build (adapter si différent, ex. dist/client)
          path: "dist"

  # Étape 2 : déploiement sur GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
