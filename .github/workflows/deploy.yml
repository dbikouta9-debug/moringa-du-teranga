# Workflow de déploiement automatique sur GitHub Pages
name: Deploy to GitHub Pages

on:
  # Se déclenche à chaque push sur la branche principale
  push:
    branches: ["main"]

  # Permet aussi un déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

# Permissions du GITHUB_TOKEN pour le déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Étape 1 : build de l'application
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache basé sur bun.lock (le projet n'a pas de package-lock.json)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Le dossier de sortie dépend de l'environnement : .output/public sur GitHub,
      # dist/client ailleurs. On copie celui qui contient index.html dans _site.
      # La copie 404.html permet au site de se charger même après un rafraîchissement.
      - name: Prepare static site
        run: |
          if [ -f .output/public/index.html ]; then OUT=.output/public;
          elif [ -f dist/client/index.html ]; then OUT=dist/client;
          else echo "index.html introuvable"; find . -name index.html -not -path './node_modules/*'; exit 1; fi
          echo "Dossier de sortie : $OUT"
          mkdir -p _site
          cp -r "$OUT"/. _site/
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  # Étape 2 : déploiement sur GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
